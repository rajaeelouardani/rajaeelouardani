<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Moroccan zellige-inspired mosaic pattern -->
  <defs>
    <pattern id="mosaic" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Geometric shapes inspired by Moroccan tiles -->
      <rect x="0" y="0" width="50" height="50" fill="#f97316" opacity="0.1"/>
      <rect x="50" y="0" width="50" height="50" fill="#ea580c" opacity="0.08"/>
      <rect x="0" y="50" width="50" height="50" fill="#ea580c" opacity="0.08"/>
      <rect x="50" y="50" width="50" height="50" fill="#f97316" opacity="0.1"/>
      
      <!-- Decorative lines -->
      <line x1="25" y1="0" x2="25" y2="100" stroke="#f97316" stroke-width="0.5" opacity="0.15"/>
      <line x1="75" y1="0" x2="75" y2="100" stroke="#f97316" stroke-width="0.5" opacity="0.15"/>
      <line x1="0" y1="25" x2="100" y2="25" stroke="#f97316" stroke-width="0.5" opacity="0.15"/>
      <line x1="0" y1="75" x2="100" y2="75" stroke="#f97316" stroke-width="0.5" opacity="0.15"/>
      
      <!-- Small decorative dots -->
      <circle cx="12.5" cy="12.5" r="1" fill="#f97316" opacity="0.2"/>
      <circle cx="87.5" cy="12.5" r="1" fill="#f97316" opacity="0.2"/>
      <circle cx="12.5" cy="87.5" r="1" fill="#f97316" opacity="0.2"/>
      <circle cx="87.5" cy="87.5" r="1" fill="#f97316" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#mosaic)"/>
</svg>

